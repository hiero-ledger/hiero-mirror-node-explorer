name: "Release Explorer"
on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: "Perform Dry Run"
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  prepare-release:
    name: Release / Prepare
    runs-on: hiero-mirror-node-linux-medium
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release@24.2.0 @semantic-release/git@10.0.1 @semantic-release/github@11.0.1 \
            @semantic-release/exec@6.0.3 semantic-release-helm3@2.9.3 \
            conventional-changelog-conventionalcommits@8.0.0 \
            @commitlint/cli@19.5.0 @commitlint/config-conventional@19.5.0 \
            marked-mangle@1.1.10 marked-gfm-heading-id@4.1.1 semantic-release-conventional-commits@3.0.0

      - name: Setup JQ
        uses: step-security/install-jq-action@01c80bba4b4dfda4f9f5df20aa272d43e93a9fb1 # v4.0.1
        with:
          version: 1.7

      - name: Calculate Next Version
        working-directory: _frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          if [[ "${{ github.event.repository.default_branch }}" == "${{ github.ref_name }}" ]]; then
            semantic-release --dry-run
          else
            if [[ "${{ inputs.dry-run-enabled }}" == "true" ]]; then
              jq -r '.version' './package.json' > VERSION
            else
              gh run cancel ${{ github.run_id }}
            fi
          fi

      - name: Retrieve Version
        working-directory: _frontend
        id: release
        run: echo "version=$(cat VERSION)" >> "${GITHUB_OUTPUT}"

  publish-container:
    name: Publish
    uses: ./.github/workflows/zxc-release-explorer-docker-container.yaml
    permissions:
      id-token: write
      packages: write
      contents: read
    needs:
      - prepare-release
    with:
      new-version: ${{ needs.prepare-release.outputs.version }}
      dry-run-enabled: ${{ inputs.dry-run-enabled }}

  publish-chart:
    name: Publish
    uses: ./.github/workflows/zxc-release-explorer-helm-chart.yaml
    permissions:
      id-token: write
      packages: write
      contents: read
    needs:
      - prepare-release
    with:
      new-version: ${{ needs.prepare-release.outputs.version }}
      dry-run-enabled: ${{ inputs.dry-run-enabled }}

  finalize-release:
    name: Release / Finalize
    runs-on: hiero-mirror-node-linux-medium
    needs:
      - publish-container
      - publish-chart
    if: ${{ inputs.dry-run-enabled != true }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release@24.2.0 @semantic-release/git@10.0.1 @semantic-release/github@11.0.1 \
            @semantic-release/exec@6.0.3 semantic-release-helm3@2.9.3 \
            conventional-changelog-conventionalcommits@8.0.0 \
            @commitlint/cli@19.5.0 @commitlint/config-conventional@19.5.0 \
            marked-mangle@1.1.10 marked-gfm-heading-id@4.1.1 semantic-release-conventional-commits@3.0.0

      - name: Finalize Release
        working-directory: _frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: npx semantic-release
